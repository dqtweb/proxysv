<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Control Panel</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, sans-serif;
      color-scheme: light dark;
      --bg: #f7f7f7;
      --panel: #ffffff;
      --border: #c4c4c4;
      --text: #111;
      --accent: #2563eb;
      --muted: #555;
    }

    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
    }

    body[data-theme="dark"] {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --accent: #93c5fd;
      --muted: #a5b4fc;
    }

    body {
      padding: 1rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
    }

    .sidebar {
      position: sticky;
      top: 1rem;
      align-self: start;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sidebar nav a {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid transparent;
    }

    .sidebar nav a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hero {
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    .hero button {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      padding: 0.5rem 1rem;
      color: var(--text);
    }

    .hero button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    label,
    select,
    input,
    button {
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      height: 6rem;
      font-family: monospace;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.5rem;
    }

    #log {
      background: #0f172a;
      color: #f8f8f2;
      padding: 0.75rem;
      border-radius: 4px;
      min-height: 8rem;
      white-space: pre-wrap;
      font-family: monospace;
    }

    #log.light {
      background: #111;
    }

    fieldset {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 1rem;
      margin-bottom: 1rem;
      background: var(--panel);
    }

    fieldset legend {
      padding: 0 0.5rem;
      font-weight: 600;
      color: var(--accent);
    }

    .section-content {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }

</style>
</head>
<body data-theme="light">
  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <strong>Navigation</strong>
        <nav>
          <a href="#connection">Connection</a>
          <a href="#commands">Server commands</a>
          <a href="#inspect">Inspect</a>
          <a href="#log">Server log</a>
        </nav>
      </div>
    </aside>
    <main>
      <section class="panel hero">
        <div>
          <h1>Control Panel</h1>
          <p style="color: var(--muted); margin: 0;">
            Send UI commands to connected clients through the WebSocket server.
          </p>
        </div>
        <button id="theme-toggle" type="button">Enable dark mode</button>
      </section>

      <section class="panel" id="connection">
        <div class="section-content">
          <p>
            Status: <strong id="status">disconnected</strong> · Agents:
            <strong id="client-count">0</strong>
          </p>
          <button id="connect">Connect</button>
        </div>
      </section>

      <section class="panel" id="commands">
        <fieldset>
          <legend>Server commands</legend>
          <div>
            <button id="ping" disabled>Send ping</button>
            <button id="echo" disabled>Send echo</button>
          </div>
          <div>
            <label for="action">Client action</label>
            <select id="action">
              <option value="console">Console log</option>
              <option value="alert">Alert</option>
              <option value="eval">Eval script</option>
            </select>
            <label for="payload-input" id="payload-label">Message</label>
            <textarea
              id="payload-input"
              rows="3"
              placeholder="Message for client or script when eval is selected"
            ></textarea>
            <button id="send-client-command" disabled>Send to client</button>
          </div>
        </fieldset>
      </section>

      <section class="panel" id="inspect">
        <fieldset>
          <legend>Inspect target</legend>
          <div>
            <button id="refresh-clients" disabled>Refresh clients</button>
            <label for="target-client">Target:</label>
            <select id="target-client" disabled></select>
          </div>
          <div>
            <label for="selector-input">Selector:</label>
            <input id="selector-input" type="text" placeholder="body" />
            <button id="inspect-target" disabled>Inspect</button>
          </div>
          <div>
            <p style="margin-bottom:0.25rem">Inspect output:</p>
            <textarea id="inspect-output" readonly></textarea>
          </div>
        </fieldset>
      </section>

      <section class="panel">
        <p style="margin-bottom:0.5rem">Server log:</p>
        <div id="log"></div>
      </section>
    </main>
  </div>

  <script>
    const connectButton = document.getElementById("connect");
    const pingButton = document.getElementById("ping");
    const echoButton = document.getElementById("echo");
    const statusEl = document.getElementById("status");
    const log = document.getElementById("log");
    const clientCountEl = document.getElementById("client-count");
    const refreshButton = document.getElementById("refresh-clients");
    const targetSelect = document.getElementById("target-client");
    const selectorInput = document.getElementById("selector-input");
    const inspectButton = document.getElementById("inspect-target");
    const inspectOutput = document.getElementById("inspect-output");
    const actionSelect = document.getElementById("action");
    const payloadLabel = document.getElementById("payload-label");
    const payloadInput = document.getElementById("payload-input");
    const sendClientCommandButton = document.getElementById("send-client-command");
    const themeToggle = document.getElementById("theme-toggle");

    const endpoint =
      window.WS_PROXY_ENDPOINT?.trim() ||
      "ws://localhost:65432";

    let socket;
    let clients = [];
    let currentTheme = "light";

    function setTheme(theme) {
      const body = document.body;
      const normalized = theme === "dark" ? "dark" : "light";
      currentTheme = normalized;
      body.setAttribute("data-theme", normalized);
      log.classList.toggle("light", normalized === "light");
      themeToggle.textContent =
        normalized === "dark" ? "Enable light mode" : "Enable dark mode";
      try {
        localStorage.setItem("controlTheme", normalized);
      } catch (err) {
        console.error("Unable to save theme preference", err);
      }
    }

    const savedTheme = localStorage.getItem("controlTheme");
    if (savedTheme) {
      setTheme(savedTheme);
    } else {
      setTheme("light");
    }

    themeToggle.addEventListener("click", () => {
      setTheme(currentTheme === "dark" ? "light" : "dark");
    });

    function appendLog(message) {
      log.textContent += message + "\n";
      log.scrollTop = log.scrollHeight;
    }

    function updateStatus(connected) {
      statusEl.textContent = connected ? "connected" : "disconnected";
      pingButton.disabled = echoButton.disabled = refreshButton.disabled = !connected;
      targetSelect.disabled = !connected;
      inspectButton.disabled = !connected || !targetSelect.value;
      sendClientCommandButton.disabled = !connected || !targetSelect.value;
      connectButton.textContent = connected ? "Reconnect" : "Connect";
    }

    function populateClients(list) {
      const agentClients = (list || []).filter((entry) => entry.role === "agent");
      clients = agentClients;
      clientCountEl.textContent = agentClients.length;
      targetSelect.innerHTML = "";
      if (!agentClients.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "no clients";
        targetSelect.appendChild(option);
        inspectButton.disabled = true;
        sendClientCommandButton.disabled = true;
        return;
      }
      agentClients.forEach((client) => {
        const option = document.createElement("option");
        option.value = client.clientId;
        option.textContent = `${client.identity} (#${client.clientId}, ${client.address})`;
        targetSelect.appendChild(option);
      });
      inspectButton.disabled = !targetSelect.value;
      sendClientCommandButton.disabled = !targetSelect.value;
    }

    function connect() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close();
      }

      socket = new WebSocket(endpoint);
      appendLog("→ connecting...");

      socket.addEventListener("open", () => {
        appendLog("Connection opened");
        updateStatus(true);
        sendCommand("register", { identity: "CP", role: "cp" });
        sendCommand("list-clients");
      });

      socket.addEventListener("message", (event) => {
        appendLog("← " + event.data);
        handleMessage(event);
      });

      socket.addEventListener("close", () => {
        appendLog("Connection closed");
        updateStatus(false);
        populateClients([]);
      });

      socket.addEventListener("error", () => {
        appendLog("WebSocket error encountered");
      });
    }

    function handleMessage(event) {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        appendLog("Invalid JSON from server");
        return;
      }

      if (data.type === "command-result") {
        if (data.command === "list-clients" && Array.isArray(data.clients)) {
          populateClients(data.clients);
        }
        return;
      }

      if (data.type === "client-list" && Array.isArray(data.clients)) {
        populateClients(data.clients);
        return;
      }

      if (data.type === "inspect-result") {
        inspectOutput.value =
          "Request " +
          data.requestId +
          ":\n" +
          JSON.stringify(data.details, null, 2);
      }
    }

    function sendCommand(command, data = null) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        appendLog("Socket not open");
        return;
      }

      const payload = { command };
      if (data !== null) {
        payload.data = data;
      }

      socket.send(JSON.stringify(payload));
      appendLog("→ " + JSON.stringify(payload));
    }

    connectButton.addEventListener("click", connect);
    pingButton.addEventListener("click", () => sendCommand("ping"));
    echoButton.addEventListener("click", () => sendCommand("echo", "Hello from controller"));
    refreshButton.addEventListener("click", () => sendCommand("list-clients"));
    inspectButton.addEventListener("click", () => {
      const targetId = parseInt(targetSelect.value, 10);
      if (!targetId) {
        appendLog("Select a client first");
        return;
      }

      sendCommand("inspect", {
        targetId,
        selector: selectorInput.value.trim() || "body",
        requestId: `inspect-${Date.now()}`,
      });
    });

    targetSelect.addEventListener("change", () => {
      inspectButton.disabled = !targetSelect.value;
      sendClientCommandButton.disabled =
        !targetSelect.value || !(socket && socket.readyState === WebSocket.OPEN);
    });

    sendClientCommandButton.addEventListener("click", () => {
      if (!targetSelect.value) {
        appendLog("Select a client first");
        return;
      }
      const action = actionSelect.value;
      const trimmed = payloadInput.value.trim();
      const payload = { action };
      if (action === "eval") {
        payload.script = trimmed || "";
      } else if (trimmed) {
        payload.message = trimmed;
      }
      sendCommand("client-command", payload);
    });
    const syncPayloadLabel = () => {
      payloadLabel.textContent = actionSelect.value === "eval" ? "Script" : "Message";
    };
    actionSelect.addEventListener("change", syncPayloadLabel);
    syncPayloadLabel();

    updateStatus(false);
  </script>
</body>
</html>

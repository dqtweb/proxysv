        width: 100%;

      th, td {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
      }
    </style>
  </head>

    <h1>ExtensionHelper</h1>

      <tr>
        <td>GL</td>

      <tr>

    </table>
    <script src="popup.js"></script>
